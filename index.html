<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardik ❤️ Nimita</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #fff7f9;
            overflow-x: hidden;
        }
        /* ---- NAVBAR ---- */
        nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            z-index: 999;
        }
        .nav-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .nav-img {
            width: 52px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.25));
        }
        nav h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #d6336c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .heart {
            display: inline-block;
            animation: heartbeat 1.3s infinite ease-in-out;
            transform-origin: center;
        }
        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }
            20% {
                transform: scale(1.3);
            }
            40% {
                transform: scale(1.6);
            }
            60% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }
        /* ---- GALLERY SECTION ---- */
        .gallery {
            margin-top: 100px;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .gallery img,
        .gallery video {
            width: 100%;
            height: 270px;
            object-fit: cover;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        }
        .gallery img:hover,
        .gallery video:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.25);
        }
        /* ---- LIGHTBOX ---- */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #lightbox img,
        #lightbox video {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            animation: fadeIn 0.35s ease;
        }
        #lightbox video {
            display: none;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* --- MOBILE FRIENDLY TABS --- */
        .tabs {
            margin-top: 90px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 15px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            background: #ffe5ec;
            border: 2px solid #ffb3c6;
            border-radius: 30px;
            font-size: 15px;
            color: #d6336c;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #d6336c;
            color: white;
            border-color: #d6336c;
            box-shadow: 0 4px 10px rgba(214, 51, 108, 0.4);
        }
        /* GALLERY HIDE/SHOW */
        .gallery {
            display: none;
        }
        .gallery.active {
            display: grid;
        }
        /* IMAGE/VIDEO WRAPPER */
        .media-box {
            position: relative;
        }
        /* DOWNLOAD BUTTON */
        .download-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 20px;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            text-decoration: none;
            display: inline-block;
        }
        .download-btn img {
            width: 20px;
            height: 20px;
            display: block;
        }
        /* SHOW ON HOVER */
        .media-box:hover .download-btn {
            opacity: 1;
            transform: translateY(3px);
        }
        /* EXTRA HOVER ANIMATION FOR MEDIA */
        .media-box img,
        .media-box video {
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }
        .media-box:hover img,
        .media-box:hover video {
            transform: scale(1.06);
            box-shadow: 0 7px 22px rgba(0, 0, 0, 0.30);
        }
        .gallery video {
            border-radius: 14px;
        }
        /* ---- OTHER SECTION STYLES ---- */
        #other {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            text-align: center;
            padding: 40px 25px;
            background: linear-gradient(135deg, rgba(255, 247, 249, 0.8), rgba(255, 229, 236, 0.8));
            border-radius: 20px;
            margin: 20px;
            box-shadow: 0 8px 30px rgba(214, 51, 108, 0.15);
            animation: slideUpFade 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        #other.active {
            display: flex;
            flex-direction: column;
            animation: slideUpFade 0.8s ease-out forwards;
        }
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #other h1 {
            font-size: 24px;
            font-weight: 600;
            color: #d6336c;
            margin: 0 0 20px 0;
            line-height: 1.4;
            animation: fadeInUp 1s ease-out 0.2s both;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #other a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #d6336c, #ff69b4);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.3);
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease-out 0.4s both;
            position: relative;
            overflow: hidden;
        }
        #other a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        #other a:hover::before {
            left: 100%;
        }
        #other a:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(214, 51, 108, 0.4);
        }
        #other .password {
            margin-top: 15px;
            font-size: 18px;
            color: #d6336c;
            font-weight: 700;
            background: rgba(255, 229, 236, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            animation: fadeInUp 1s ease-out 0.6s both;
            border: 2px dashed #ffb3c6;
        }
        #other .heart-icon {
            font-size: 28px;
            animation: heartbeat 1.5s infinite ease-in-out;
            margin: 0 10px;
        }
    </style>
</head>

    <script>
        // Enable music autoplay (browser-safe)
        window.addEventListener("DOMContentLoaded", () => {
            const music = document.getElementById("bgMusic");
            music.volume = 0.30;
            const startMusic = () => {
                music.play().catch(() => { });
                document.removeEventListener("click", startMusic);
                document.removeEventListener("touchstart", startMusic);
            };
            document.addEventListener("click", startMusic);
            document.addEventListener("touchstart", startMusic);
        });
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxVideo = document.getElementById("lightbox-video");
        // Handle image clicks
        const galleryImages = document.querySelectorAll(".gallery img");
        galleryImages.forEach(img => {
            img.addEventListener("click", (e) => {
                e.stopPropagation();
                lightboxVideo.style.display = "none";
                lightboxVideo.pause();
                lightboxImg.style.display = "block";
                lightboxImg.src = img.src;
                lightbox.style.display = "flex";
            });
        });
        // Handle video clicks
        const galleryVideos = document.querySelectorAll(".gallery video");
        galleryVideos.forEach(video => {
            video.addEventListener("click", (e) => {
                e.stopPropagation();
                lightboxImg.style.display = "none";
                lightboxVideo.style.display = "block";
                lightboxVideo.innerHTML = video.innerHTML;
                lightbox.style.display = "flex";
                lightboxVideo.play().catch(() => { }); // Auto-play if possible
            });
        });
        // Close lightbox
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) {
                lightbox.style.display = "none";
                lightboxVideo.pause();
                lightboxVideo.innerHTML = ""; // Clear video content
            }
        });
        // Tab functionality
        const tabs = document.querySelectorAll(".tab-btn");
        const galleries = document.querySelectorAll(".gallery");
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                let target = tab.getAttribute("data-tab");
                // Remove active from all buttons
                tabs.forEach(btn => btn.classList.remove("active"));
                tab.classList.add("active");
                // Show matching gallery
                galleries.forEach(g => {
                    g.classList.remove("active");
                    if (g.id === target) {
                        g.classList.add("active");
                    }
                });
            });
        });
    </script>
